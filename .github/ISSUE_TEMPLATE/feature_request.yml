name: Feature request
description: Propose new behavior or provider support
title: "feat: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem or limitation should be solved?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe desired behavior, not only implementation details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing behavior or simpler option did you consider?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Provider support
        - Usage parsing
        - TUI or formatting
        - Configuration
        - Commands
        - Packaging or documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: provider-docs
    attributes:
      label: Provider documentation
      description: >-
        For provider changes, link official or OpenUsage documentation and
        describe credential and endpoint requirements. Never paste tokens.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Expected behavior is observable in the TUI
        - [ ] Configuration remains backward compatible
        - [ ] Tests cover parsing and error cases
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This request solves a concrete current need.
          required: true
        - label: No credentials or private account data are included.
          required: true
