name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: >-
        Thanks for reporting a bug. Remove credentials and tokens from all
        logs and screenshots.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
      placeholder: Describe the incorrect behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options:
        - Claude
        - Codex
        - Grok
        - Multiple providers
        - Configuration or UI
        - Not provider-specific
    validations:
      required: true

  - type: input
    id: pi-version
    attributes:
      label: Pi version
      placeholder: "0.80.10"
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11, macOS 15, Ubuntu 24.04"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: >-
        Optional. Redact emails, account IDs, access tokens, refresh tokens,
        and auth files.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private account data.
          required: true
        - label: I can reproduce this with the latest extension version.
          required: true
